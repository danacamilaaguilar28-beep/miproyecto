<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Captura de Datos</title>
</head>
<body>

  <h2>Captura de Datos</h2>

  <form id="formulario" action="https://script.google.com/macros/s/AKfycby6PXEbgthzJxR7VxjaFzAz5syxfqGtUm69udc7ijC3fObmzGX4foVi4Jo0r1gcrr4E/exec" method="POST" target="hidden_iframe" onsubmit="enviado()">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="edad">Edad:</label><br>
    <input type="text" id="edad" name="edad" required min="1" max="120"><br><br>

    <label for="gmail">gmail:</label><br>
    <input type="text" id="gmail" name="gmail" required min="1" max="120"><br><br>

     <label for="genero">genero:</label><br>
    <input type="text" id="genero" name="genero" required min="1" max="120"><br><br>
  
     <label for="apellido">apellido:</label><br>
    <input type="text" id="apellido" name="apellido" required min="1" max="120"><br><br>

     <label for="num">num:</label><br>
    <input type="text" id="num" name="num" required min="1" max="120"><br><br>

     <label for="direccion">direccion:</label><br>
    <input type="text" id="direccion" name="direccion" required min="1" max="120"><br><br>

    <button type="submit" id="btnEnviar">Enviar</button>
  </form>

  <p id="estado"></p>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    function enviado() {
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando...';
      
      setTimeout(function() {
        document.getElementById('estado').textContent = '¡Registro guardado con éxito!';
        document.getElementById('formulario').reset();
        document.getElementById('btnEnviar').disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
